global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    basic_auth:
      username: writer            # must match PROM_USER in .env
      password_file: /etc/prometheus/secrets/password
    static_configs:
      - targets: ["localhost:9090"]
# Cluster metrics arrive via remote_write, no scrape config needed for them.
